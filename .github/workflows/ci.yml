# CI «Пульт селлера» — гейты Story 1.1 (Structural Seed).
# jobs: rust (fmt + build/clippy/test --locked),
#       spa (vitest + build + bundle-gate AD-30, PASS и FAIL-направления),
#       gates (hexagonal-lint AD-1, valkey-grep AD-28 — PASS и FAIL-направления),
#       integration (compose up --wait + миграции + /health + psql-проверка таблиц;
#         Story 1.4: конвейер e2e — WB-заглушка → quorum-очередь → проекция → канбан,
#         дубль-событие NO-OP, чекпоинт-продолжение после kill -9, 401≠ретрай,
#         429-терпимость, plaintext-инварианты).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt + build + clippy + test, --locked)
    # Пин образа (не ubuntu-latest): latest мигрирует на Ubuntu 26 с
    # 2026-10-19 — детерминизм toolchain'а дороже свежести. Апгрейд на
    # ubuntu-26.04 — отдельная осознанная задача, не попутная правка.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pult
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pult
      - name: fmt
        run: cargo fmt --all -- --check
      - name: build
        run: cargo build --workspace --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  spa:
    name: spa (vitest + build + bundle gate AD-30)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pult/shells/bitrix24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pult/shells/bitrix24/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - name: bundle-size gate (критический путь < 200 КБ gzip)
        # шаговый working-directory переопределяет job-дефолт (pult/shells/bitrix24):
        # пути к скрипту и dist — от корня репозитория.
        working-directory: ${{ github.workspace }}
        run: node pult/platform/scripts/bundle-size.mjs pult/shells/bitrix24/dist 200000
      - name: негатив bundle-гейта — заниженный лимит обязан падать (exit 1)
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          node pult/platform/scripts/bundle-size.mjs pult/shells/bitrix24/dist 1000 > /tmp/bundle-neg.log 2>&1
          code=$?
          set -e
          cat /tmp/bundle-neg.log
          if [ "$code" -eq 0 ]; then
            echo "ОШИБКА: гейт пропустил превышение бюджета"; exit 1
          fi
          if [ "$code" -ne 1 ]; then
            echo "ожидался exit 1 (бюджет превышен), получен $code"; exit 1
          fi
          echo "негатив bundle-гейта отработал (exit 1)"
      - name: негатив bundle-гейта — отсутствующий входной чанк обязан падать (exit 2)
        working-directory: ${{ github.workspace }}
        run: |
          bad=$(mktemp -d)
          printf '<script type="module" src="/real.js"></script>\n<script type="module" src="/ghost-missing.js"></script>\n' > "$bad/index.html"
          printf 'console.log(1)\n' > "$bad/real.js"
          set +e
          node pult/platform/scripts/bundle-size.mjs "$bad" 200000 > /tmp/bundle-neg2.log 2>&1
          code=$?
          set -e
          cat /tmp/bundle-neg2.log
          if [ "$code" -ne 2 ]; then
            echo "ОШИБКА: ожидался exit 2 (чанк отсутствует — молчаливое выпадение из бюджета), получен $code"; exit 1
          fi
          echo "негатив bundle-гейта (отсутствующий чанк) отработал (exit 2)"

  gates:
    name: gates (hexagonal AD-1 + cache-adapter grep AD-28, PASS и FAIL)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: hexagonal-lint — граница ядра чиста (PASS)
        run: node pult/platform/scripts/hexagonal-lint.mjs
      - name: valkey-grep — запрещённых образов кэша нет (PASS)
        run: node pult/platform/scripts/valkey-grep.mjs
      - name: vault-grep — plaintext-колонок токенов нет (PASS, AD-16)
        run: node pult/platform/scripts/vault-grep.mjs
      - name: негатив vault-grep — все 3 класса детекции ловятся (exit 1)
        run: |
          # Ревью 1.3: один негатив-файл покрывал только класс SECRET_COLUMN_RES;
          # LITERAL_PATTERNS и SECRET_PLAINTEXT_TYPE_RE остались непроверенными —
          # их регрессия прошла бы CI зелёным. Один файл на класс + PASS-файл
          # с блочным комментарием (не должен ловиться).
          bad=$(mktemp -d)
          printf 'CREATE TABLE leaky_a (token_plaintext bytea NOT NULL);\n' > "$bad/01_literal.sql"
          printf 'ALTER TABLE leaky_b ADD COLUMN token text;\n' > "$bad/02_type.sql"
          printf 'CREATE TABLE leaky_c (\n    api_key varchar(64) NOT NULL\n);\n' > "$bad/03_column.sql"
          printf '/* benign: token text inside block comment */\nCREATE TABLE ok_d (id uuid);\n' > "$bad/04_benign.sql"
          set +e
          node pult/platform/scripts/vault-grep.mjs "$bad" > /tmp/vault-neg.log 2>&1
          code=$?
          set -e
          cat /tmp/vault-neg.log
          if [ "$code" -ne 1 ]; then
            echo "ОШИБКА: ожидался exit 1 (plaintext-колонки токенов), получен $code"; exit 1
          fi
          [ "$(grep -c '01_literal.sql' /tmp/vault-neg.log)" = "1" ] || { echo "класс LITERAL_PATTERNS не отработал"; exit 1; }
          [ "$(grep -c '02_type.sql' /tmp/vault-neg.log)" = "1" ] || { echo "класс SECRET_PLAINTEXT_TYPE_RE не отработал"; exit 1; }
          [ "$(grep -c '03_column.sql' /tmp/vault-neg.log)" = "1" ] || { echo "класс SECRET_COLUMN_RES не отработал"; exit 1; }
          [ "$(grep -c '04_benign.sql' /tmp/vault-neg.log)" = "0" ] || { echo "блочный комментарий ложно пойман"; exit 1; }
          echo "негатив vault-grep отработал (3 класса детекции, exit 1)"
      - name: негатив hexagonal-lint — алиас через [workspace.dependencies] ловится (exit 1)
        run: |
          bad=$(mktemp -d)
          mkdir -p "$bad/core/sneaky2/src"
          printf '%s\n' \
            '[workspace]' \
            '[workspace.dependencies]' \
            'bus = { path = "conveyor/action_bus" }' \
            > "$bad/Cargo.toml"
          printf '%s\n' \
            '[package]' \
            'name = "pult-core-sneaky2"' \
            'version = "0.0.0"' \
            'edition = "2024"' \
            '' \
            '[dependencies]' \
            'bus = { workspace = true }' \
            > "$bad/core/sneaky2/Cargo.toml"
          printf '%s\n' 'use bus as _;' > "$bad/core/sneaky2/src/lib.rs"
          set +e
          node pult/platform/scripts/hexagonal-lint.mjs "$bad" > /tmp/hex-neg3.log 2>&1
          code=$?
          set -e
          cat /tmp/hex-neg3.log
          if [ "$code" -ne 1 ]; then
            echo "ОШИБКА: ожидался exit 1, получен $code — гейт пропускает workspace-алиас на конвейер"; exit 1
          fi
          echo "негатив hexagonal-lint (workspace-алиас) отработал (exit 1)"
      - name: негатив hexagonal-lint — dev-dep и use к конвейеру роняют гейт (exit 1)
        run: |
          bad=$(mktemp -d)
          mkdir -p "$bad/core/badcrate/src"
          printf '%s\n' \
            '[package]' \
            'name = "pult-core-badcrate"' \
            'version = "0.0.0"' \
            'edition = "2024"' \
            '' \
            '[dev-dependencies]' \
            'pult-conveyor-adapters = { path = "../../conveyor/adapters" }' \
            > "$bad/core/badcrate/Cargo.toml"
          printf '%s\n' 'use pult_conveyor_reconciliation as _;' > "$bad/core/badcrate/src/lib.rs"
          set +e
          node pult/platform/scripts/hexagonal-lint.mjs "$bad" > /tmp/hex-neg1.log 2>&1
          code=$?
          set -e
          cat /tmp/hex-neg1.log
          if [ "$code" -ne 1 ]; then
            echo "ОШИБКА: ожидался exit 1, получен $code — гейт пропускает зависимость/импорт конвейера в ядре"; exit 1
          fi
          echo "негатив hexagonal-lint (dev-dep + use) отработал (exit 1)"
      - name: негатив hexagonal-lint — path-dep по ключу без префикса pult-conveyor- тоже ловится (exit 1)
        run: |
          bad=$(mktemp -d)
          mkdir -p "$bad/core/sneaky/src"
          printf '%s\n' \
            '[package]' \
            'name = "pult-core-sneaky"' \
            'version = "0.0.0"' \
            'edition = "2024"' \
            '' \
            '[dependencies]' \
            'adapters = { path = "../../conveyor/adapters" }' \
            > "$bad/core/sneaky/Cargo.toml"
          printf '%s\n' '// чистый исходник без импортов' > "$bad/core/sneaky/src/lib.rs"
          set +e
          node pult/platform/scripts/hexagonal-lint.mjs "$bad" > /tmp/hex-neg2.log 2>&1
          code=$?
          set -e
          cat /tmp/hex-neg2.log
          if [ "$code" -ne 1 ]; then
            echo "ОШИБКА: ожидался exit 1, получен $code — path-dep conveyor/ проходит гейт"; exit 1
          fi
          echo "негатив hexagonal-lint (path conveyor/) отработал (exit 1)"
      - name: hexagonal-lint — комментарии в Cargo.toml не триггерят гейт (PASS)
        run: |
          clean=$(mktemp -d)
          mkdir -p "$clean/core/okcrate/src"
          printf '%s\n' \
            '[package]' \
            'name = "pult-core-okcrate"' \
            'version = "0.0.0"' \
            'edition = "2024"' \
            '# упоминание pult-conveyor-adapters в комментарии — не зависимость' \
            > "$clean/core/okcrate/Cargo.toml"
          printf '%s\n' '// чистый исходник' > "$clean/core/okcrate/src/lib.rs"
          node pult/platform/scripts/hexagonal-lint.mjs "$clean"
      - name: негатив hexagonal-lint — пустой core/ обязан падать (exit 2)
        run: |
          empty=$(mktemp -d)
          mkdir -p "$empty/core"
          set +e
          node pult/platform/scripts/hexagonal-lint.mjs "$empty" > /tmp/hex-empty.log 2>&1
          code=$?
          set -e
          cat /tmp/hex-empty.log
          if [ "$code" -ne 2 ]; then
            echo "ОШИБКА: ожидался exit 2 для пустого core/, получен $code"; exit 1
          fi
          echo "guard пустого core/ отработал (exit 2)"
      - name: негатив valkey-grep — запрещённый кэш-образ роняет гейт (exit 1)
        run: |
          bad=$(mktemp -d)
          printf '%s\n' 'services:' '  cache:' '    image: redis:7.2' > "$bad/compose.yml"
          printf 'FROM redis:8\n' > "$bad/Dockerfile.check"
          set +e
          node pult/platform/scripts/valkey-grep.mjs "$bad" > /tmp/valkey-neg.log 2>&1
          code=$?
          set -e
          cat /tmp/valkey-neg.log
          if [ "$code" -ne 1 ]; then
            echo "ОШИБКА: ожидался exit 1, получен $code — гейт пропускает запрещённый образ"; exit 1
          fi
          echo "негатив valkey-grep отработал (exit 1)"

  integration:
    name: integration (compose + migrations + /health + tables)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [rust, gates]
    env:
      # ТЕСТОВЫЙ мастер-ключ vault (AD-16): конфиг требует обязательный
      # PULT_VAULT_MASTER_KEY (hex 32 байта) — в CI фиксированный, не секрет.
      # Единый источник для обоих запусков шлюза (ревью 1.3: без job-level
      # env дрейф между шагами).
      PULT_VAULT_MASTER_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      # Подмена хоста проб: GitHub-раннер ИМЕЕТ выход в интернет — живые
      # площадки ответили бы 401 (rejected), и e2e-инвариант «неуспешная
      # проба не сохраняет» зависел бы от сети раннера, а не от кода
      # (ревью 1.3, pre-verified). 127.0.0.1:9 = детерминированный
      # probe_unavailable (порт discard — отказ соединения).
      PULT_PROBE_HOST_OVERRIDE: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pult
      - name: dev-stack up --wait (PG 18, RabbitMQ 4.4 quorum, Valkey 9.1)
        run: docker compose -f pult/deploy/docker-compose.yml up -d --wait
      - name: диагностика контейнеров при сбое подъёма
        if: failure()
        run: docker compose -f pult/deploy/docker-compose.yml logs --tail 60
      - name: собрать шлюз и воркеры конвейера (1.4)
        working-directory: pult
        run: cargo build --bin pult-gateway --bin pult-workers --locked
      - name: запустить шлюз (миграции применяются на старте)
        working-directory: pult
        run: |
          DATABASE_URL=postgres://pult:pult@localhost:5432/pult \
            nohup target/debug/pult-gateway > /tmp/pult-gateway.log 2>&1 &
          echo $! > /tmp/pult-gateway.pid
          sleep 2
          cat /tmp/pult-gateway.log
      - name: /health → 200 (после применения миграций)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s --max-time 10 -o /tmp/health-ok.json -w '%{http_code}' http://localhost:8080/health || true)
            body=$(cat /tmp/health-ok.json 2>/dev/null || true)
            echo "попытка $i: /health → $code $body"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"status":"ok"'; then exit 0; fi
            sleep 2
          done
          echo "/health не ответил 200 ok за 120 с"; exit 1
      - name: /ready → 200
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /tmp/ready-ok.json -w '%{http_code}' http://localhost:8080/ready || true)
            body=$(cat /tmp/ready-ok.json 2>/dev/null || true)
            echo "попытка $i: /ready → $code $body"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"status":"ready"'; then exit 0; fi
            sleep 2
          done
          echo "/ready не ответил 200 ready за 60 с"; exit 1
      - name: /health → 503 degraded и /ready → not_ready (флаг миграций жив) при недоступной БД
        run: |
          docker compose -f pult/deploy/docker-compose.yml stop postgres
          code=""
          for i in $(seq 1 15); do
            code=$(curl -s --max-time 10 -o /tmp/health.json -w '%{http_code}' http://localhost:8080/health || true)
            echo "попытка $i: /health → $code $(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "503" ] && grep -q '"status":"degraded"' /tmp/health.json; then break; fi
            sleep 2
          done
          curl -s --max-time 10 -o /tmp/ready.json -w '%{http_code}' http://localhost:8080/ready > /tmp/ready.code || true
          ready_code=$(cat /tmp/ready.code 2>/dev/null || true)
          echo "/ready → $ready_code $(cat /tmp/ready.json 2>/dev/null || true)"
          # /v1 в деградации (ревью 1.2): валидация работает без БД (422 до
          # касания БД), состояние — честный 503-конверт, не пустой ответ.
          v1_code=$(curl -s --max-time 10 -o /tmp/v1-deg.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"trade_model":"wholesale"}' http://localhost:8080/v1/perimeter/verdict || true)
          state_code=$(curl -s --max-time 10 -o /tmp/v1-state.json -w '%{http_code}' http://localhost:8080/v1/onboarding/state || true)
          # БД возвращается в стек ДО ассертов: провал ассерта (bash -e) не должен
          # обрывать шаг раньше восстановления окружения.
          docker compose -f pult/deploy/docker-compose.yml start postgres
          [ "$code" = "503" ] && grep -q '"status":"degraded"' /tmp/health.json \
            || { echo "::error::FAIL: /health при недоступной БД — 503 degraded"; exit 1; }
          [ "$ready_code" = "503" ] \
            || { echo "::error::FAIL: /ready при недоступной БД — 503"; exit 1; }
          grep -q '"status":"not_ready"' /tmp/ready.json \
            || { echo "::error::FAIL: /ready → not_ready"; exit 1; }
          grep -q '"migrations_applied":true' /tmp/ready.json \
            || { echo "::error::FAIL: /ready → migrations_applied=true (флаг миграций жив)"; exit 1; }
          [ "$v1_code" = "422" ] && grep -q '"code":"invalid_trade_model"' /tmp/v1-deg.json \
            || { echo "::error::FAIL: /v1-валидация в деградации — 422 invalid_trade_model"; exit 1; }
          [ "$state_code" = "503" ] && grep -q '"code":"database_unavailable"' /tmp/v1-state.json \
            || { echo "::error::FAIL: /v1/onboarding/state в деградации — 503 database_unavailable"; exit 1; }
          # Подключения 1.3 в деградации: GET — честный 503-конверт (ревью 1.3:
          # новые эндпоинты под тем же договором деградации, что и шаг 0).
          conn_code=$(curl -s --max-time 10 -o /tmp/v1-conn.json -w '%{http_code}' \
            "http://localhost:8080/v1/connections" || true)
          [ "$conn_code" = "503" ] && grep -q '"code":"database_unavailable"' /tmp/v1-conn.json \
            || { echo "::error::FAIL: /v1/connections в деградации — 503 database_unavailable"; exit 1; }
      - name: БД восстановилась → /health снова 200 ok
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /tmp/health-re.json -w '%{http_code}' http://localhost:8080/health || true)
            body=$(cat /tmp/health-re.json 2>/dev/null || true)
            echo "попытка $i: /health → $code $body"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"status":"ok"'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: sentinel-строка до повторного подъёма (данные должны пережить up)
        run: |
          docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
            psql -U pult -d pult -c "INSERT INTO organizations (name) VALUES ('ci-sentinel-survives-reup')"
      - name: повторный compose up не ломает данные
        run: docker compose -f pult/deploy/docker-compose.yml up -d --wait
      - name: sentinel-строка пережила повторный up
        run: |
          docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
            psql -U pult -d pult -tAc \
            "SELECT count(*) FROM organizations WHERE name = 'ci-sentinel-survives-reup'" \
            | grep -qx '1' || { echo "::error::FAIL: sentinel-строка не пережила повторный up"; exit 1; }
      - name: psql — 9 таблиц (Story 1.1 + шаг 0 + подключения 1.3 + синк 1.4) существуют
        run: |
          docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
            psql -U pult -d pult -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('organizations','users','role_assignments','portal_settings','perimeter_verdicts','marketplace_connections','sync_runs','orders','order_items')" \
            | grep -qx '9' || { echo "::error::FAIL: в public не 9 таблиц (Story 1.1 + 1.2 + 1.3 + 1.4)"; exit 1; }
      - name: повторный запуск шлюза — миграции no-op, /ready → ready (идемпотентность)
        working-directory: pult
        run: |
          kill "$(cat /tmp/pult-gateway.pid)" 2>/dev/null || true
          sleep 2
          DATABASE_URL=postgres://pult:pult@localhost:5432/pult \
            nohup target/debug/pult-gateway > /tmp/pult-gateway-2.log 2>&1 &
          echo $! > /tmp/pult-gateway.pid
          for i in $(seq 1 30); do
            hcode=$(curl -s --max-time 10 -o /tmp/h2.json -w '%{http_code}' http://localhost:8080/health || true)
            rcode=$(curl -s --max-time 10 -o /tmp/r2.json -w '%{http_code}' http://localhost:8080/ready || true)
            echo "попытка $i: /health → $hcode $(cat /tmp/h2.json) / /ready → $rcode $(cat /tmp/r2.json)"
            if [ "$hcode" = "200" ] && grep -q '"status":"ok"' /tmp/h2.json \
              && [ "$rcode" = "200" ] && grep -q '"status":"ready"' /tmp/r2.json; then
              echo "свежий процесс шлюза вернулся в ready — повторные миграции прошли как no-op"
              exit 0
            fi
            sleep 2
          done
          echo "шлюз не достиг /health=200 + /ready=200 за 60 с"; exit 1
      - name: "шаг 0 (e2e) — селлер: state → verdict → funnel, иммутабельность"
        run: |
          base='http://localhost:8080'
          qs='DOMAIN=ci-shop.example&USER_ID=1'
          # Первый вход: вопросник требуется.
          code=$(curl -s --max-time 10 -o /tmp/s0.json -w '%{http_code}' "$base/v1/onboarding/state?$qs")
          [ "$code" = "200" ] && grep -q '"state":"step0_required"' /tmp/s0.json \
            || { echo "::error::FAIL: первый вход — вопросник (step0_required)"; exit 1; }
          # Ответ селлера → funnel.
          code=$(curl -s --max-time 10 -o /tmp/v0.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"trade_model":"marketplace_seller","marketplaces":["wildberries","ozon"]}' \
            "$base/v1/perimeter/verdict?$qs")
          [ "$code" = "200" ] && grep -q '"verdict":"seller"' /tmp/v0.json && grep -q '"state":"funnel"' /tmp/v0.json \
            || { echo "::error::FAIL: вердикт селлера — funnel"; exit 1; }
          # Повторное открытие: вопросник не показывается (per-user запоминание).
          code=$(curl -s --max-time 10 -o /tmp/s1.json -w '%{http_code}' "$base/v1/onboarding/state?$qs")
          [ "$code" = "200" ] && grep -q '"state":"funnel"' /tmp/s1.json \
            || { echo "::error::FAIL: повторное открытие — вопросник не должен возвращаться"; exit 1; }
          # Иммутабельность: повторный POST с ДРУГИМИ ответами возвращает сохранённый вердикт.
          code=$(curl -s --max-time 10 -o /tmp/v1.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"trade_model":"services_other"}' \
            "$base/v1/perimeter/verdict?$qs")
          [ "$code" = "200" ] && grep -q '"verdict":"seller"' /tmp/v1.json && grep -q '"state":"funnel"' /tmp/v1.json \
            || { echo "::error::FAIL: иммутабельность вердикта селлера"; exit 1; }
          echo "селлер-поток шага 0 отработал (вопросник → funnel, вердикт иммутабелен)"
      - name: "шаг 0 (e2e) — не-селлер: отказ и терминальный экран"
        run: |
          base='http://localhost:8080'
          qs='DOMAIN=ci-other.example&USER_ID=7'
          code=$(curl -s --max-time 10 -o /tmp/s2.json -w '%{http_code}' "$base/v1/onboarding/state?$qs")
          [ "$code" = "200" ] && grep -q '"state":"step0_required"' /tmp/s2.json \
            || { echo "::error::FAIL: первый вход не-селлера — вопросник"; exit 1; }
          code=$(curl -s --max-time 10 -o /tmp/v2.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"trade_model":"services_other"}' \
            "$base/v1/perimeter/verdict?$qs")
          [ "$code" = "200" ] && grep -q '"verdict":"non_seller"' /tmp/v2.json && grep -q '"state":"exit_screen"' /tmp/v2.json \
            || { echo "::error::FAIL: не-селлер — отказ + exit_screen"; exit 1; }
          code=$(curl -s --max-time 10 -o /tmp/s3.json -w '%{http_code}' "$base/v1/onboarding/state?$qs")
          [ "$code" = "200" ] && grep -q '"state":"exit_screen"' /tmp/s3.json \
            || { echo "::error::FAIL: повторное открытие не-селлера — exit_screen"; exit 1; }
          # Иммутабельность для не-селлера: повторный POST возвращает сохранённый
          # вердикт (формальное ревью 1.2: обе ветки вердикта под ассертом).
          code=$(curl -s --max-time 10 -o /tmp/v3.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"trade_model":"own_channels_no_marketplaces"}' \
            "$base/v1/perimeter/verdict?$qs")
          [ "$code" = "200" ] && grep -q '"verdict":"non_seller"' /tmp/v3.json && grep -q '"state":"exit_screen"' /tmp/v3.json \
            || { echo "::error::FAIL: иммутабельность вердикта не-селлера"; exit 1; }
          echo "не-селлер-поток отработал (честный отказ, воронка закрыта)"
      - name: "шаг 0 (e2e) — валидация и метрика (знаменатель активации UJ-1)"
        run: |
          base='http://localhost:8080'
          # Невалидная модель — 422 человекочитаемым конвертом, без касания БД.
          code=$(curl -s --max-time 10 -o /tmp/e0.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"trade_model":"wholesale"}' "$base/v1/perimeter/verdict")
          [ "$code" = "422" ] && grep -q '"code":"invalid_trade_model"' /tmp/e0.json \
            || { echo "::error::FAIL: невалидная модель — 422 invalid_trade_model"; exit 1; }
          # Селлерская модель без площадок — 422.
          code=$(curl -s --max-time 10 -o /tmp/e1.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"trade_model":"marketplace_planned","marketplaces":[]}' "$base/v1/perimeter/verdict")
          [ "$code" = "422" ] && grep -q '"code":"marketplaces_required"' /tmp/e1.json \
            || { echo "::error::FAIL: селлер без площадок — 422 marketplaces_required"; exit 1; }
          # Контракт конверта на ЛЮБОМ маршруте (формальное ревью 1.2):
          # 404/405 тоже под конвертом, резервный DOMAIN — 422 до касания БД.
          code=$(curl -s --max-time 10 -o /tmp/nf.json -w '%{http_code}' "$base/v1/nope")
          [ "$code" = "404" ] && grep -q '"code":"not_found"' /tmp/nf.json \
            || { echo "::error::FAIL: 404 под конвертом not_found"; exit 1; }
          code=$(curl -s --max-time 10 -o /tmp/mna.json -w '%{http_code}' "$base/v1/perimeter/verdict")
          [ "$code" = "405" ] && grep -q '"code":"method_not_allowed"' /tmp/mna.json \
            || { echo "::error::FAIL: 405 под конвертом method_not_allowed"; exit 1; }
          code=$(curl -s --max-time 10 -o /tmp/rv.json -w '%{http_code}' "$base/v1/onboarding/state?DOMAIN=dev-portal&USER_ID=1")
          [ "$code" = "422" ] && grep -q '"code":"reserved_member_id"' /tmp/rv.json \
            || { echo "::error::FAIL: резервный DOMAIN — 422 reserved_member_id"; exit 1; }
          # Метрика: 2 установки (ci-shop + ci-other), обе прошли шаг 0, 1 селлер.
          # dev-фоллбэк реально создаётся запросом без placement-параметров и
          # НЕ меняет счётчики (исключение фиксируется этим же ассертом);
          # sentinel-строка (b24_member_id IS NULL) тоже не считается.
          # grep-якоря «значение,» отсекают ложные совпадения префиксом.
          # dev-фоллбэк не только не ломает метрику — он реально создаётся
          # (200 + вопросник) и виден в реестре (формальное ревью 1.2:
          # проба с выброшенным ответом проверяла только половину контракта).
          code=$(curl -s --max-time 10 -o /tmp/dev0.json -w '%{http_code}' "$base/v1/onboarding/state")
          [ "$code" = "200" ] && grep -q '"state":"step0_required"' /tmp/dev0.json \
            || { echo "::error::FAIL: dev-фоллбэк — 200 + вопросник"; exit 1; }
          docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
            psql -U pult -d pult -tAc \
            "SELECT count(*) FROM organizations WHERE b24_member_id = 'dev-portal'" \
            | grep -qx '1' || { echo "::error::FAIL: dev-фоллбэк не создан в реестре"; exit 1; }
          code=$(curl -s --max-time 10 -o /tmp/m0.json -w '%{http_code}' "$base/v1/metrics/perimeter")
          [ "$code" = "200" ] \
            && grep -q '"installs":2,' /tmp/m0.json \
            && grep -q '"step0_completed":2,' /tmp/m0.json \
            && grep -q '"sellers":1,' /tmp/m0.json \
            && grep -q '"step0_share":1.0}' /tmp/m0.json \
            || { echo "::error::FAIL: метрика шага 0 (installs=2, completed=2, sellers=1, share=1.0)"; exit 1; }
          echo "валидация и метрика шага 0 отработали (dev-фоллбэк исключён)"
      - name: "шаг 1.3 (e2e) — подключения: 422, probe_unavailable не сохраняет, DELETE"
        run: |
          base='http://localhost:8080'
          qs='DOMAIN=ci-connect.example&USER_ID=9'
          # GET без подключений — пустой список (write-on-GET нет).
          code=$(curl -s --max-time 10 -o /tmp/c0.json -w '%{http_code}' "$base/v1/connections?$qs")
          [ "$code" = "200" ] && grep -q '"connections":\[\]' /tmp/c0.json \
            || { echo "::error::FAIL: GET без подключений — пустой список"; exit 1; }
          # Валидация до пробы и БД: неизвестная площадка и пустой токен — 422.
          code=$(curl -s --max-time 10 -o /tmp/c1.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"marketplace":"aliexpress","schemes":["fbo"],"token":"x"}' "$base/v1/connections?$qs")
          [ "$code" = "422" ] && grep -q '"code":"unknown_marketplace"' /tmp/c1.json \
            || { echo "::error::FAIL: aliexpress — 422 unknown_marketplace"; exit 1; }
          code=$(curl -s --max-time 10 -o /tmp/c2.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"marketplace":"wildberries","schemes":["fbo"],"token":""}' "$base/v1/connections?$qs")
          [ "$code" = "422" ] && grep -q '"code":"invalid_token"' /tmp/c2.json \
            || { echo "::error::FAIL: пустой токен — 422 invalid_token"; exit 1; }
          code=$(curl -s --max-time 10 -o /tmp/c3.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"marketplace":"ozon","schemes":["realfbs"],"token":"x","client_id":"1"}' "$base/v1/connections?$qs")
          [ "$code" = "422" ] && grep -q '"code":"invalid_schemes"' /tmp/c3.json \
            || { echo "::error::FAIL: realfbs для Ozon — 422 invalid_schemes"; exit 1; }
          # Ozon без Client-Id — 422 (ревью 1.3: 4-й код валидации без e2e).
          code=$(curl -s --max-time 10 -o /tmp/c7.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"marketplace":"ozon","schemes":["fbo"],"token":"x"}' "$base/v1/connections?$qs")
          [ "$code" = "422" ] && grep -q '"code":"invalid_client_id"' /tmp/c7.json \
            || { echo "::error::FAIL: Ozon без Client-Id — 422 invalid_client_id"; exit 1; }
          # Валидное тело: пробы идут на PULT_PROBE_HOST_OVERRIDE (127.0.0.1:9
          # — детерминированный отказ соединения), поэтому честный
          # probe_unavailable и инвариант «неуспешная проба не сохраняет»:
          # GET остаётся пустым. От сети раннера ассерт не зависит.
          code=$(curl -s --max-time 30 -o /tmp/c4.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"marketplace":"wildberries","schemes":["fbo"],"token":"ci-probe-token"}' "$base/v1/connections?$qs")
          [ "$code" = "200" ] && grep -q '"status":"probe_unavailable"' /tmp/c4.json \
            || { echo "::error::FAIL: пробы на :9 — 200 probe_unavailable (детерминированно)"; exit 1; }
          code=$(curl -s --max-time 10 -o /tmp/c5.json -w '%{http_code}' "$base/v1/connections?$qs")
          [ "$code" = "200" ] && grep -q '"connections":\[\]' /tmp/c5.json \
            || { echo "::error::FAIL: неуспешная проба не сохраняет — GET пуст"; exit 1; }
          # DELETE идемпотентен: отсутствие строки — 200.
          code=$(curl -s --max-time 10 -o /tmp/c6.json -w '%{http_code}' -X DELETE "$base/v1/connections/wildberries?$qs")
          [ "$code" = "200" ] && grep -q '"status":"deleted"' /tmp/c6.json \
            || { echo "::error::FAIL: DELETE идемпотентен — 200 deleted"; exit 1; }
          echo "e2e подключений 1.3 отработали (422 / probe_unavailable-не-сохраняет / DELETE)"
      - name: триггер updated_at — UPDATE строки обновляет updated_at (Story 1.3, deferred 1.1)
        run: |
          psql_exec() {
            docker compose -f pult/deploy/docker-compose.yml exec -T postgres psql -U pult -d pult "$@"
          }
          # Транзакция 1: фикстура-подключение (created_at = updated_at = now(t1)).
          # Фикстура: nonce — валидный 12-байтный hex-литерал bytea (ревью 1.3:
          # repeat('\x00',12) — не валидный bytea-ввод, psql падал).
          psql_exec -c "INSERT INTO organizations (id, name, b24_member_id) \
            VALUES ('11111111-1111-1111-1111-111111111111', 'ci-upd-trig', 'ci-upd-trig') \
            ON CONFLICT DO NOTHING; \
            INSERT INTO marketplace_connections (id, organization_id, marketplace, schemes, status, token_ciphertext, token_nonce) \
            VALUES ('22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111', \
                    'wildberries', '[\"fbo\"]', 'verified', '\\x00', '\\x000000000000000000000000') \
            ON CONFLICT DO NOTHING;"
          sleep 1
          # Транзакция 2 (через 1с): UPDATE обязан поднять updated_at триггером;
          # сравнение с created_at осмысленно только между транзакциями (now()
          # внутри одной транзакции константен).
          psql_exec -c "UPDATE marketplace_connections SET schemes = '[\"fbo\",\"fbs\"]' \
            WHERE id = '22222222-2222-2222-2222-222222222222';"
          psql_exec -tAc "SELECT CASE WHEN updated_at > created_at \
            THEN 'trigger-present' ELSE 'trigger-missing' END \
            FROM marketplace_connections WHERE id = '22222222-2222-2222-2222-222222222222';" \
            | grep -qx 'trigger-present' || { echo "::error::FAIL: триггер set_updated_at не поднял updated_at после UPDATE"; exit 1; }
          psql_exec -c "DELETE FROM marketplace_connections WHERE id = '22222222-2222-2222-2222-222222222222'; \
            DELETE FROM organizations WHERE id = '11111111-1111-1111-1111-111111111111';" > /dev/null
          echo "триггер set_updated_at подтверждён (updated_at > created_at после UPDATE)"
      - name: "шаг 1.3 (e2e) — полный verified-лайфсайкл через локальную заглушку проб"
        run: |
          # Диагностика сбоя run 3e5d9d0 (integration красная, шаг молчал 3с):
          # ассерты вида [ тест ] && grep при bash -e либо умирают МОЛЧА
          # (отказ последней команды AND-списка), либо «мягко» пропускаются
          # (отказ НЕ последней команды — шаг продолжает работу, ложное
          # зелёное). Каждая проверка теперь громкая: при любом несоответствии
          # печатаются код, тело ответа, лог заглушки (достигали ли её пробы)
          # и лог шлюза (verified / probe_unavailable / store-ошибка).
          cat > /tmp/probe_stub.py << 'PYEOF'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Stub(BaseHTTPRequestHandler):
              def _ok(self):
                  print('STUB <- %s %s' % (self.command, self.path), flush=True)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  body = b'{}'
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              do_GET = do_POST = _ok
              def log_message(self, *args):
                  pass
          HTTPServer(('127.0.0.1', 18081), Stub).serve_forever()
          PYEOF
          nohup python3 /tmp/probe_stub.py > /tmp/probe-stub.log 2>&1 &
          echo $! > /tmp/probe-stub.pid
          # Громкие проверки: fail печатает evidence (тела, логи) и роняет шаг.
          dump_evidence() {
            echo "--- /tmp/probe-stub.log: достигали ли пробы заглушки ---"
            cat /tmp/probe-stub.log 2>/dev/null || true
            echo "--- /tmp/pult-gateway-3.log (хвост 80) ---"
            tail -n 80 /tmp/pult-gateway-3.log 2>/dev/null || true
          }
          fail() { echo "::error::FAIL: $1"; dump_evidence; exit 1; }
          check_code() { [ "$2" = "$3" ] || fail "$1 — код $2, ожидался $3"; }
          check_body() { grep -q "$2" "$3" 2>/dev/null || fail "$1 — в теле ответа нет: $2"; }
          check_absent() { ! grep -q "$2" "$3" 2>/dev/null || fail "$1 — в теле найдено запрещённое: $2"; }
          psql_count() {
            docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
              psql -U pult -d pult -tAc "$1" 2>/dev/null | tr -d '[:space:]' || true
          }
          # Readiness-полл заглушки (формальное ревью 1.3: голый sleep 1 —
          # гонка с медленным стартом python).
          stub_ok=0
          for i in $(seq 1 20); do
            if curl -s --max-time 2 -o /dev/null http://127.0.0.1:18081/any; then stub_ok=1; break; fi
            sleep 0.5
          done
          [ "$stub_ok" = "1" ] || fail "заглушка проб не поднялась"
          # Перезапуск шлюза с override на ЗАГЛУШКУ (job-level override :9 —
          # для предыдущего шага probe_unavailable): степ-окружение сильнее
          # job-level. Старый процесс гасим (иначе порт 8080 занят); новый
          # pid пишется в тот же файл — остановка в конце убьёт актуальный.
          kill "$(cat /tmp/pult-gateway.pid)" 2>/dev/null || true
          sleep 2
          PULT_PROBE_HOST_OVERRIDE=http://127.0.0.1:18081 \
          DATABASE_URL=postgres://pult:pult@localhost:5432/pult \
            nohup pult/target/debug/pult-gateway > /tmp/pult-gateway-3.log 2>&1 &
          echo $! > /tmp/pult-gateway.pid
          hcode=000
          for i in $(seq 1 30); do
            hcode=$(curl -s --max-time 10 -o /tmp/h3.json -w '%{http_code}' http://localhost:8080/health || true)
            [ "$hcode" = "200" ] && break
            sleep 1
          done
          check_code "шлюз с override-заглушкой не поднялся (/health)" "$hcode" "200"
          base='http://localhost:8080'
          qs='DOMAIN=ci-verified.example&USER_ID=11'
          body_wb='{"marketplace":"wildberries","schemes":["fbo","fbs"],"token":"ci-plaintext-secret-1234"}'
          # Автотест подтверждён → verified, шифротекст записан.
          code=$(curl -s --max-time 30 -o /tmp/v0.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d "$body_wb" "$base/v1/connections?$qs" || true)
          check_code "POST WB (первичное подключение)" "$code" "200"
          check_body "POST WB → verified" '"status":"verified"' /tmp/v0.json
          check_body "POST WB → право категории «Статистика»" '"name":"Статистика"' /tmp/v0.json
          # GET показывает строку (без секретов).
          code=$(curl -s --max-time 10 -o /tmp/v1.json -w '%{http_code}' "$base/v1/connections?$qs" || true)
          check_code "GET подключений после save" "$code" "200"
          check_body "GET → wildberries" '"marketplace":"wildberries"' /tmp/v1.json
          check_body "GET → схемы fbo+fbs" '"schemes":\["fbo","fbs"\]' /tmp/v1.json
          check_absent "GET без plaintext токена" 'ci-plaintext-secret' /tmp/v1.json
          # Ротация: повторный POST перезаписывает (ON CONFLICT DO UPDATE), а не дублирует.
          code=$(curl -s --max-time 30 -o /tmp/v2.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"marketplace":"wildberries","schemes":["fbo"],"token":"ci-rotated-token-5678"}' "$base/v1/connections?$qs" || true)
          check_code "POST WB (ротация)" "$code" "200"
          check_body "ротация → verified" '"status":"verified"' /tmp/v2.json
          code=$(curl -s --max-time 10 -o /tmp/v3.json -w '%{http_code}' "$base/v1/connections?$qs" || true)
          check_code "GET после ротации" "$code" "200"
          check_body "ротация перезаписала схемы (ровно fbo)" '"schemes":\["fbo"\]' /tmp/v3.json
          # Ozon-нога (формальное ревью 1.3, AC-3): client_id сохраняется и
          # возвращается GET-ом — до этого шага verified-путь Ozon не исполнялся
          # ни одной автоматической проверкой.
          code=$(curl -s --max-time 30 -o /tmp/v6.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"marketplace":"ozon","schemes":["fbo","rfbs"],"token":"ci-ozon-key-9012","client_id":"424242"}' "$base/v1/connections?$qs" || true)
          check_code "POST Ozon" "$code" "200"
          check_body "Ozon → verified" '"status":"verified"' /tmp/v6.json
          code=$(curl -s --max-time 10 -o /tmp/v7.json -w '%{http_code}' "$base/v1/connections?$qs" || true)
          check_code "GET обеих площадок" "$code" "200"
          check_body "GET → ozon" '"marketplace":"ozon"' /tmp/v7.json
          check_body "GET → client_id 424242" '"client_id":"424242"' /tmp/v7.json
          check_body "GET → схемы Ozon fbo+rfbs" '"schemes":\["fbo","rfbs"\]' /tmp/v7.json
          check_absent "GET Ozon без plaintext ключа" 'ci-ozon-key' /tmp/v7.json
          # Инвариант логов (формальное ревью 1.3): plaintext токенов НЕ в логе
          # шлюза (маски «…1234/…5678» этих подстрок не содержат).
          check_absent "plaintext первичного токена НЕ в логе шлюза" 'ci-plaintext-secret' /tmp/pult-gateway-3.log
          check_absent "plaintext токена ротации НЕ в логе шлюза" 'ci-rotated-token' /tmp/pult-gateway-3.log
          check_absent "plaintext ключа Ozon НЕ в логе шлюза" 'ci-ozon-key' /tmp/pult-gateway-3.log
          # Ровно одна строка WB (UNIQUE(organization_id, marketplace)).
          wb_rows=$(psql_count "SELECT count(*) FROM marketplace_connections WHERE marketplace='wildberries'")
          echo "строк WB в БД: $wb_rows"
          [ "$wb_rows" = "1" ] || fail "ожидалась ровно 1 строка WB, получено '$wb_rows'"
          # AD-16: plaintext-подстроки токенов НЕ в шифротексте/nonce (psql).
          leak_rows=$(psql_count "SELECT count(*) FROM marketplace_connections \
            WHERE encode(token_ciphertext, 'escape') LIKE '%ci-plaintext-secret%' \
               OR encode(token_ciphertext, 'escape') LIKE '%ci-rotated-token%' \
               OR encode(token_ciphertext, 'escape') LIKE '%ci-ozon-key%' \
               OR encode(token_nonce, 'escape') LIKE '%ci-%'")
          echo "строк с plaintext-подстроками в шифротексте/nonce: $leak_rows"
          [ "$leak_rows" = "0" ] || fail "plaintext-подстроки в шифротексте/nonce: '$leak_rows' строк"
          # DELETE обеих строк → GET снова пуст. Корневая причина красного
          # integration с d4b60fd: Ozon-нога добавлена в лайфсайкл, но хвост
          # шага остался от версии с одной WB — после DELETE wildberries
          # в списке оставалась Ozon-строка, финальный grep на пустой список
          # молча ронял шаг (bash -e, последняя команда AND-списка).
          # Теперь удаляются обе — заодно e2e покрывает DELETE существующей
          # Ozon-строки (до этого — только идемпотентное удаление отсутствующей).
          code=$(curl -s --max-time 10 -o /tmp/v4.json -w '%{http_code}' -X DELETE "$base/v1/connections/wildberries?$qs" || true)
          check_code "DELETE WB" "$code" "200"
          check_body "DELETE WB → deleted" '"status":"deleted"' /tmp/v4.json
          code=$(curl -s --max-time 10 -o /tmp/v4b.json -w '%{http_code}' -X DELETE "$base/v1/connections/ozon?$qs" || true)
          check_code "DELETE Ozon" "$code" "200"
          check_body "DELETE Ozon → deleted" '"status":"deleted"' /tmp/v4b.json
          code=$(curl -s --max-time 10 -o /tmp/v5.json -w '%{http_code}' "$base/v1/connections?$qs" || true)
          check_code "GET после DELETE обеих площадок" "$code" "200"
          check_body "GET → пустой список" '"connections":\[\]' /tmp/v5.json
          kill "$(cat /tmp/probe-stub.pid)" 2>/dev/null || true
          echo "verified-лайфсайкл 1.3 подтверждён (save/GET/ротация/DELETE, plaintext не в БД)"
      - name: "1.4 (e2e) — заглушка WB (история/пустая/401/429) + verified-подключения"
        run: |
          # WB-заглушка на 127.0.0.1:18081 — порт проб-заглушки шага 1.3 (та
          # убита): работающий шлюз gateway-3 уже смотрит на него override'ом —
          # пробы прав (stocks/goods/filter, любые пути) получают 2xx → verified,
          # рестарт шлюза не нужен. Путь /api/v1/supplier/orders — «история»:
          # детерминированные ветки по токену, без интернета (паттерн 1.3).
          cat > /tmp/wb_stub.py << 'PYEOF'
          import json, os, time
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)
          def rfc(dt):
              return dt.strftime('%Y-%m-%dT%H:%M:%SZ')
          yesterday = now - timedelta(days=1)
          # История: два заказа — структурные ветки словаря статусов (таблица
          # кодов WB пуста [ASSUMPTION] до живого токена владельца): finished
          # → delivered, isCancel → risk. Оба менялись вчера → попадают в
          # первое (самое свежее) окно — «канбан жив» с первого окна.
          ORDERS = [
              {"date": rfc(yesterday), "lastChangeDate": rfc(yesterday),
               "supplierArticle": "ART-DELIVERED", "techSize": "M", "barcode": "2000000000001",
               "total": 10, "discountPercent": 10, "isCancel": False, "incomeID": 555,
               "warehouseName": "Коледино", "orderId": 771, "nmId": 101, "subject": "Платья",
               "category": "Женщинам", "brand": "Бренд", "status": 3, "finished": True,
               "price": 10000, "totalPrice": 9000},
              {"date": rfc(yesterday), "lastChangeDate": rfc(yesterday),
               "supplierArticle": "ART-CANCELLED", "techSize": "L", "barcode": "2000000000002",
               "total": 10, "discountPercent": 0, "isCancel": True, "incomeID": 0,
               "warehouseName": "Электросталь", "orderId": 772, "nmId": 102, "subject": "Платья",
               "category": "Женщинам", "brand": "Бренд", "status": 0, "finished": False,
               "price": 5000, "totalPrice": 5000},
          ]
          # Даты дубля (шаг AD-15): тест переиздаёт событие 771 с ТОЙ же ревизией.
          with open('/tmp/wb_stub_dates.json', 'w') as f:
              json.dump({"order_date": rfc(yesterday), "last_change_at": rfc(yesterday)}, f)

          SLOW = '/tmp/wb_stub_slow'   # сценарий чекпоинт-продолжения: пауза на окно
          hits = [0]

          class Stub(BaseHTTPRequestHandler):
              def _reply(self, code, body, extra=None):
                  self.send_response(code)
                  self.send_header('Content-Type', 'application/json')
                  for k, v in (extra or {}).items():
                      self.send_header(k, v)
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def serve(self):
                  token = self.headers.get('Authorization', '')
                  ts = time.strftime('%H:%M:%S')
                  if self.path.startswith('/api/v1/supplier/orders'):
                      # мёртвый токен: 401 ДО счётчика лимита (не расходует сценарий).
                      if 'ci-dead-token' in token:
                          print(f'[{ts}] STUB <- GET {self.path} auth={token} -> 401', flush=True)
                          self._reply(401, b'{"status":401,"detail":"invalid API access token"}')
                          return
                      if os.path.exists(SLOW):
                          time.sleep(2)
                      hits[0] += 1
                      n = hits[0]
                      if n == 1:
                          print(f'[{ts}] STUB <- GET {self.path} auth={token} -> 429 (Retry-After: 1)', flush=True)
                          self._reply(429, b'{"error":"rate limited"}', {'Retry-After': '1'})
                          return
                      if n == 2:
                          print(f'[{ts}] STUB <- GET {self.path} auth={token} -> 429 (без заголовка)', flush=True)
                          self._reply(429, b'{"error":"rate limited"}')
                          return
                      if 'ci-empty-token' in token:
                          print(f'[{ts}] STUB <- GET {self.path} auth={token} -> 200 []', flush=True)
                          self._reply(200, b'[]')
                          return
                      print(f'[{ts}] STUB <- GET {self.path} auth={token} -> 200 orders=2', flush=True)
                      self._reply(200, json.dumps(ORDERS).encode())
                      return
                  # пробы прав 1.3 (stocks / goods/filter — любые пути): 2xx {} → verified
                  print(f'[{ts}] STUB <- {self.command} {self.path} auth={token} -> 200 probe', flush=True)
                  self._reply(200, b'{}')
              def do_GET(self):
                  self.serve()
              def do_POST(self):
                  self.serve()
              def log_message(self, *args):
                  pass

          ThreadingHTTPServer(('127.0.0.1', 18081), Stub).serve_forever()
          PYEOF
          nohup python3 /tmp/wb_stub.py > /tmp/wb-stub.log 2>&1 &
          echo $! > /tmp/wb-stub.pid
          stub_ok=0
          for i in $(seq 1 20); do
            if curl -s --max-time 2 -o /dev/null http://127.0.0.1:18081/any; then stub_ok=1; break; fi
            sleep 0.5
          done
          [ "$stub_ok" = "1" ] || { echo "::error::FAIL: WB-заглушка не поднялась"; cat /tmp/wb-stub.log 2>/dev/null; exit 1; }
          # PULT_SYNC_SINCE — один на всю джобу (GITHUB_ENV): сетка окон обязана
          # быть стабильной между запусками воркеров (конфиг-инвариант цикла).
          echo "PULT_SYNC_SINCE=$(date -u -d '30 days ago' +%Y-%m-%dT00:00:00Z)" >> "$GITHUB_ENV"
          # Verified-подключения трёх организаций (пробы шлюза идут в заглушку):
          # рабочая история / пустой кабинет / мёртвый токен.
          base='http://localhost:8080'
          for org in 'ci-sync.example|13|ci-wb-sync-token' 'ci-empty.example|12|ci-empty-token' 'ci-dead.example|15|ci-dead-token'; do
            IFS='|' read -r domain user token <<< "$org"
            code=$(curl -s --max-time 30 -o /tmp/conn14.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d "{\"marketplace\":\"wildberries\",\"schemes\":[\"fbo\",\"fbs\"],\"token\":\"$token\"}" \
              "$base/v1/connections?DOMAIN=$domain&USER_ID=$user" || true)
            [ "$code" = "200" ] && grep -q '"status":"verified"' /tmp/conn14.json \
              || { echo "::error::FAIL: подключение $domain не verified (код $code): $(cat /tmp/conn14.json 2>/dev/null)"; exit 1; }
          done
          echo "заглушка WB поднята, 3 организации verified (история / пусто / мёртвый токен)"
      - name: "1.4 (e2e) — конвейер: заказ в канбане (happy + пустая история + 401≠ретрай + 429)"
        run: |
          base='http://localhost:8080'
          fail() { echo "::error::FAIL: $1"; exit 1; }
          psql_count() {
            docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
              psql -U pult -d pult -tAc "$1" 2>/dev/null | tr -d '[:space:]' || true
          }
          start_worker() {
            DATABASE_URL=postgres://pult:pult@localhost:5432/pult \
            PULT_RABBITMQ_URL=amqp://pult:pult@127.0.0.1:5672/%2F \
            PULT_WB_STAT_BASE=http://127.0.0.1:18081 \
            PULT_SCHEDULER_INTERVAL_SECS=2 \
            PULT_WB_TIMEOUT_SECS=20 \
              nohup pult/target/debug/pult-workers > "$1" 2>&1 &
            echo $! > /tmp/pult-workers.pid
          }
          wait_progress() { # qs want timeout_secs out_file
            local qs="$1" want="$2" tmo="$3" out="$4" ok=""
            for i in $(seq 1 $((tmo / 2))); do
              code=$(curl -s --max-time 10 -o "$out" -w '%{http_code}' "$base/v1/sync/progress?$qs" || true)
              if [ "$code" = "200" ] && grep -q "\"status\":\"$want\"" "$out" 2>/dev/null; then ok=1; break; fi
              sleep 2
            done
            [ -n "$ok" ] || fail "синк ($qs) не достиг $want за ${tmo}с (последний ответ: $(cat "$out" 2>/dev/null))"
          }

          # Воркер конвейера: расшифровка vault → WB-заглушка → quorum-очередь → проекция.
          # PULT_SYNC_SINCE приходит из GITHUB_ENV (шаг заглушки).
          start_worker /tmp/pult-workers.log

          # Happy: 5 окон, 2 заказа (771 delivered / 772 risk), в начале 2×429 — терпим.
          wait_progress 'DOMAIN=ci-sync.example&USER_ID=13' succeeded 120 /tmp/p14a.json
          grep -q '"phase":"completed"' /tmp/p14a.json || fail "фаза succeeded ≠ completed: $(cat /tmp/p14a.json)"
          grep -q '"percent":100' /tmp/p14a.json || fail "percent ≠ 100"
          grep -q '"eta_seconds":0' /tmp/p14a.json || fail "полный охват → eta 0"
          grep -q '"windows_total":5' /tmp/p14a.json || fail "windows_total ≠ 5 (сетка PULT_SYNC_SINCE)"
          grep -q '"windows_done":5' /tmp/p14a.json || fail "windows_done ≠ 5"
          grep -q '"orders_fetched":2' /tmp/p14a.json || fail "orders_fetched ≠ 2"
          grep -q '"events_published":2' /tmp/p14a.json || fail "events_published ≠ 2"

          # 429-терпимость: заглушка отдала два 429 подряд (с Retry-After и без) —
          # адаптер пережил (ассерты выше доказывают чтение окон), улики в логах.
          grep -q 'WB 429: пауза и повтор' /tmp/pult-workers.log || fail "в логе воркера нет 429-пауз"
          [ "$(grep -c -- '-> 429' /tmp/wb-stub.log)" = "2" ] || fail "заглушка отдала не ровно 2 лимит-ответа"

          # Пустая история: succeeded + честная пустая доска (200, колонки — явные пустые массивы).
          wait_progress 'DOMAIN=ci-empty.example&USER_ID=12' succeeded 120 /tmp/p14e.json
          grep -q '"orders_fetched":0' /tmp/p14e.json || fail "пустая история ≠ 0 заказов"
          grep -q '"events_published":0' /tmp/p14e.json || fail "пустая история ≠ 0 событий"
          code=$(curl -s --max-time 10 -o /tmp/b14e.json -w '%{http_code}' "$base/v1/board/orders?DOMAIN=ci-empty.example&USER_ID=12" || true)
          [ "$code" = "200" ] || fail "доска пустой успешной истории ≠ 200 (честное «заказов пока нет»): $code $(cat /tmp/b14e.json 2>/dev/null)"
          grep -q '"new":\[\]' /tmp/b14e.json && grep -q '"delivered":\[\]' /tmp/b14e.json \
            || fail "пустые колонки не явные массивы: $(cat /tmp/b14e.json)"

          # 401 ≠ ретрай: цикл failed с человекочитаемой диагностикой; доска честный 409; ретрай идемпотентен.
          wait_progress 'DOMAIN=ci-dead.example&USER_ID=15' failed 120 /tmp/p14d.json
          grep -q '"error_hint":"токен WB отклонён площадкой' /tmp/p14d.json \
            || fail "error_hint без диагноза 401: $(cat /tmp/p14d.json)"
          grep -q '"percent":0' /tmp/p14d.json || fail "процент failed-цикла ≠ 0"
          code=$(curl -s --max-time 10 -o /tmp/b14d.json -w '%{http_code}' "$base/v1/board/orders?DOMAIN=ci-dead.example&USER_ID=15" || true)
          [ "$code" = "409" ] && grep -q '"code":"sync_failed"' /tmp/b14d.json \
            || fail "доска failed-синка ≠ 409 sync_failed: $code $(cat /tmp/b14d.json 2>/dev/null)"
          code=$(curl -s --max-time 10 -o /tmp/r14d.json -w '%{http_code}' -X POST "$base/v1/sync/retry?DOMAIN=ci-dead.example&USER_ID=15" || true)
          [ "$code" = "200" ] || fail "POST /v1/sync/retry ≠ 200: $code $(cat /tmp/r14d.json 2>/dev/null)"
          # токен мёртв → после сброса цикл честно падает снова (решает человек)
          wait_progress 'DOMAIN=ci-dead.example&USER_ID=15' failed 60 /tmp/p14d2.json
          grep -q '"error_hint":"токен WB отклонён площадкой' /tmp/p14d2.json \
            || fail "после ретрая 401 не честно failed снова: $(cat /tmp/p14d2.json)"

          # Доска: заказ в канбане — словарь 7 колонок, структурные ветки, totals, позиции.
          code=$(curl -s --max-time 10 -o /tmp/b14a.json -w '%{http_code}' "$base/v1/board/orders?DOMAIN=ci-sync.example&USER_ID=13" || true)
          [ "$code" = "200" ] || fail "доска ci-sync ≠ 200: $code $(cat /tmp/b14a.json 2>/dev/null)"
          grep -q '"external_order_id":"771"' /tmp/b14a.json || fail "заказ 771 не на доске"
          grep -q '"board_column":"delivered"' /tmp/b14a.json || fail "771 (finished) не в delivered"
          grep -q '"board_column":"risk"' /tmp/b14a.json || fail "772 (isCancel) не в risk"
          grep -q '"scheme":"fbo"' /tmp/b14a.json || fail "771 (incomeID=555) не fbo"
          grep -q '"scheme":"fbs"' /tmp/b14a.json || fail "772 (incomeID=0) не fbs"
          grep -q '"total_kopecks":9000' /tmp/b14a.json || fail "сумма 771 ≠ 9000 копеек"
          grep -q '"article":"ART-DELIVERED"' /tmp/b14a.json || fail "позиция карточки без артикула"
          grep -q '"delivered":1' /tmp/b14a.json || fail "totals.delivered ≠ 1"
          grep -q '"risk":1}' /tmp/b14a.json || fail "totals.risk ≠ 1"

          # PG-проекция: строки, позиции, уникальные idem-ключи, без сырых строк (AD-22).
          n=$(psql_count "SELECT count(*) FROM orders o JOIN organizations g ON g.id=o.organization_id WHERE g.b24_member_id='ci-sync.example'")
          [ "$n" = "2" ] || fail "заказов в проекции ci-sync ≠ 2 ($n)"
          n=$(psql_count "SELECT count(*) FROM order_items i JOIN orders o ON o.id=i.order_id AND o.organization_id=i.organization_id JOIN organizations g ON g.id=o.organization_id WHERE g.b24_member_id='ci-sync.example'")
          [ "$n" = "2" ] || fail "позиций заказа ≠ 2 ($n)"
          n=$(psql_count "SELECT count(*) FROM orders WHERE platform_payload IS NOT NULL")
          [ "$n" = "0" ] || fail "platform_payload в 1.4 обязан быть NULL ($n строк)"
          n=$(psql_count "SELECT count(DISTINCT idem_key) FROM orders")
          m=$(psql_count "SELECT count(*) FROM orders")
          [ "$n" = "$m" ] || fail "idem-ключи не уникальны ($n из $m)"
          n=$(psql_count "SELECT count(*) FROM sync_runs")
          [ "$n" = "3" ] || fail "строк sync_runs ≠ 3 ($n)"
          n=$(psql_count "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'orders\\_p%'")
          [ "$n" = "4" ] || fail "хэш-партиций orders ≠ 4 ($n)"

          # Plaintext-инварианты: токены не в логах и не в ответах API.
          for secret in ci-wb-sync-token ci-empty-token ci-dead-token; do
            if grep -q "$secret" /tmp/pult-workers.log; then fail "plaintext токена $secret в логе воркера"; fi
            if grep -q "$secret" /tmp/b14a.json; then fail "plaintext токена $secret в ответе доски"; fi
          done
          echo "конвейер 1.4: happy/пусто/401/429 подтверждены (заказ в канбане, честные статусы)"
      - name: "1.4 (e2e) — дубль события = NO-OP (AD-15, at-least-once)"
        run: |
          fail() { echo "::error::FAIL: $1"; exit 1; }
          psql_count() {
            docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
              psql -U pult -d pult -tAc "$1" 2>/dev/null | tr -d '[:space:]' || true
          }
          org=$(psql_count "SELECT id FROM organizations WHERE b24_member_id = 'ci-sync.example'")
          [ -n "$org" ] || fail "организация ci-sync не найдена в реестре"
          # Дубль события 771: ДРУГОЙ event_id/occurred_at, но ТА ЖЕ ревизия
          # (last_change_at) → тот же sha256 idem-ключ → проекция обязана дать NO-OP.
          # Публикация — management-API брокера (pult/pult, тег administrator из
          # rabbitmq.conf): в раннере не нужен pip, только python-stdlib + curl.
          python3 - "$org" << 'PYEOF' > /tmp/dup_publish.json
          import json, sys, uuid
          from datetime import datetime, timezone

          org = sys.argv[1]
          dates = json.load(open('/tmp/wb_stub_dates.json'))
          order = {
              "organization_id": org,
              "marketplace": "wildberries",
              "external_order_id": "771",
              "scheme": "fbo",
              "board_column": "delivered",
              "status_code": 3,
              "is_cancelled": False,
              "warehouse_name": "Коледино",
              "order_date": dates["order_date"],
              "last_change_at": dates["last_change_at"],
              "items": [{
                  "supplier_article": "ART-DELIVERED",
                  "tech_size": "M",
                  "barcode": "2000000000001",
                  "nm_id": 101,
                  "quantity": 1,
                  "price_kopecks": 10000,
                  "total_price_kopecks": 9000,
                  "discount_percent": 10,
              }],
              "total_price_kopecks": 9000,
              "currency": "RUB",
          }
          event = {
              "event_id": str(uuid.uuid4()),
              "event_type": "order.upserted",
              "organization_id": org,
              "occurred_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "schema_version": 1,
              "order": order,
          }
          print(json.dumps({
              "routing_key": org,
              "payload": json.dumps(event, ensure_ascii=True),
              "payload_encoding": "string",
              "properties": {"content_type": "application/json", "delivery_mode": 2},
          }))
          PYEOF
          code=$(curl -s --max-time 10 -o /tmp/dup_resp.json -w '%{http_code}' -u pult:pult \
            -H 'Content-Type: application/json' -X POST --data-binary @/tmp/dup_publish.json \
            'http://127.0.0.1:15672/api/exchanges/%2F/pult.orders/publish' || true)
          [ "$code" = "200" ] || fail "публикация дубля через management-API не прошла (код $code): $(cat /tmp/dup_resp.json 2>/dev/null)"
          grep -q '"routed":true' /tmp/dup_resp.json || fail "дубль не маршрутизирован в очередь pult.orders.v1"
          # Консьюмер обязан забрать дубль (очередь пустеет) и НЕ создать строку (AD-15).
          depth=""
          for i in $(seq 1 15); do
            depth=$(curl -s --max-time 5 -u pult:pult 'http://127.0.0.1:15672/api/queues/%2F/pult.orders.v1' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("messages", -1))' 2>/dev/null || echo err)
            [ "$depth" = "0" ] && break
            sleep 2
          done
          [ "$depth" = "0" ] || fail "очередь не опустела после дубля (messages=$depth) — консьюмер не забрал"
          n=$(psql_count "SELECT count(*) FROM orders o JOIN organizations g ON g.id=o.organization_id WHERE g.b24_member_id='ci-sync.example'")
          [ "$n" = "2" ] || fail "дубль создал строку! заказов $n вместо 2 (AD-15 нарушен)"
          n=$(psql_count "SELECT count(*) FROM order_items")
          [ "$n" = "2" ] || fail "дубль создал позиции! $n вместо 2"
          echo "дубль события = NO-OP подтверждён (очередь пуста, строк по-прежнему 2)"
      - name: "1.4 (e2e) — чекпоинт-продолжение: крах воркера (kill -9) → продолжение с чекпоинта (AD-3)"
        run: |
          base='http://localhost:8080'
          fail() { echo "::error::FAIL: $1"; exit 1; }
          psql_count() {
            docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
              psql -U pult -d pult -tAc "$1" 2>/dev/null | tr -d '[:space:]' || true
          }
          start_worker() {
            DATABASE_URL=postgres://pult:pult@localhost:5432/pult \
            PULT_RABBITMQ_URL=amqp://pult:pult@127.0.0.1:5672/%2F \
            PULT_WB_STAT_BASE=http://127.0.0.1:18081 \
            PULT_SCHEDULER_INTERVAL_SECS=2 \
            PULT_WB_TIMEOUT_SECS=20 \
              nohup pult/target/debug/pult-workers > "$1" 2>&1 &
            echo $! > /tmp/pult-workers.pid
          }
          # Четвёртая организация — её цикл пойдёт под «медленной» заглушкой (2с/окно).
          code=$(curl -s --max-time 30 -o /tmp/conn14r.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"marketplace":"wildberries","schemes":["fbo"],"token":"ci-restart-token"}' \
            "$base/v1/connections?DOMAIN=ci-restart.example&USER_ID=14" || true)
          [ "$code" = "200" ] && grep -q '"status":"verified"' /tmp/conn14r.json \
            || fail "подключение ci-restart не verified: $code $(cat /tmp/conn14r.json 2>/dev/null)"
          # Воркер-1 больше не нужен (его циклы терминальны), заглушка станет медленной.
          kill "$(cat /tmp/pult-workers.pid)" 2>/dev/null || true
          sleep 2
          kill -9 "$(cat /tmp/pult-workers.pid)" 2>/dev/null || true
          touch /tmp/wb_stub_slow
          start_worker /tmp/pult-workers-2.log
          # ~9с под медленной заглушкой (2,1с/окно): краш ловит цикл в середине.
          sleep 9
          kill -9 "$(cat /tmp/pult-workers.pid)" 2>/dev/null || true
          sleep 1
          # Состояние после краха: running + частичный прогресс + живой чекпоинт.
          st=$(psql_count "SELECT status FROM sync_runs r JOIN organizations g ON g.id=r.organization_id WHERE g.b24_member_id='ci-restart.example'")
          done_n=$(psql_count "SELECT windows_done FROM sync_runs r JOIN organizations g ON g.id=r.organization_id WHERE g.b24_member_id='ci-restart.example'")
          tot=$(psql_count "SELECT windows_total FROM sync_runs r JOIN organizations g ON g.id=r.organization_id WHERE g.b24_member_id='ci-restart.example'")
          cu=$(psql_count "SELECT (checkpoint->>'completed_until') FROM sync_runs r JOIN organizations g ON g.id=r.organization_id WHERE g.b24_member_id='ci-restart.example'")
          echo "после kill -9: status=$st windows_done=$done_n/$tot completed_until=$cu"
          [ "$st" = "running" ] || fail "после краха статус ≠ running ($st)"
          [ "$tot" = "5" ] || fail "windows_total ≠ 5 ($tot)"
          [ "$done_n" -ge 1 ] && [ "$done_n" -le 4 ] || fail "windows_done после краха вне [1..4] ($done_n) — тайминг сценария"
          [ -n "$cu" ] || fail "чекпоинт completed_until пуст"
          # «Канбан жив»: заказ 771 уже на доске ДО рестарта (первое окно от новых —
          # события уже спроецированы консьюмером до краха).
          ok=""
          for i in $(seq 1 10); do
            code=$(curl -s --max-time 10 -o /tmp/b14r.json -w '%{http_code}' "$base/v1/board/orders?DOMAIN=ci-restart.example&USER_ID=14" || true)
            if [ "$code" = "200" ] && grep -q '"external_order_id":"771"' /tmp/b14r.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || fail "заказ 771 не на доске ci-restart после первого окна (доска живёт с первого окна)"
          # Снимок лога заглушки ДО рестарта: запросы фазы-1.
          grep 'ci-restart-token' /tmp/wb-stub.log | grep -c '/api/v1/supplier/orders' > /tmp/wb_restart_n1 || true
          rm -f /tmp/wb_stub_slow
          # Рестарт: планировщик подхватывает running-строку и продолжает с чекпоинта.
          start_worker /tmp/pult-workers-3.log
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /tmp/p14r.json -w '%{http_code}' "$base/v1/sync/progress?DOMAIN=ci-restart.example&USER_ID=14" || true)
            if [ "$code" = "200" ] && grep -q '"status":"succeeded"' /tmp/p14r.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || fail "после рестарта цикл не дошёл до succeeded ($(cat /tmp/p14r.json 2>/dev/null))"
          grep -q '"windows_done":5' /tmp/p14r.json || fail "windows_done ≠ 5 после рестарта"
          grep -q '"percent":100' /tmp/p14r.json || fail "percent ≠ 100 после рестарта"
          # Доказательство продолжения: все окна фазы-2 СТАРШЕ completed_until на
          # момент краха (съеденные окна не перечитаны); повторён только оборванный
          # интервал — единственный допустимый дубль.
          python3 - "$cu" << 'PYEOF'
          import re, sys
          from collections import Counter
          from datetime import datetime

          cu = datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00'))
          n1 = int(open('/tmp/wb_restart_n1').read().strip() or '0')
          lines = [l for l in open('/tmp/wb-stub.log')
                   if 'ci-restart-token' in l and '/api/v1/supplier/orders' in l]
          phase1, phase2 = lines[:n1], lines[n1:]

          def datefrom(line):
              raw = re.search(r'dateFrom=([^& ]+)', line).group(1)
              return datetime.fromisoformat(raw.replace('Z', '+00:00'))

          assert len(phase1) >= 1, 'нет запросов фазы-1 (крах до первого окна?)'
          assert phase2, 'нет запросов фазы-2 — рестарт не продолжил цикл'
          for line in phase2:
              d = datefrom(line)
              assert d < cu, f'окно {d} не старше completed_until {cu} — съеденное окно перечитано!'
          all_dates = [datefrom(l) for l in lines]
          uniq = len(set(all_dates))
          assert uniq == 5, f'уникальных окон {uniq} ≠ 5'
          over = {d: c for d, c in Counter(all_dates).items() if c > 2}
          assert not over, f'какое-то окно запрошено более 2 раз: {over}'
          dup = sum(1 for c in Counter(all_dates).values() if c == 2)
          assert dup <= 1, f'повторённых окон больше одного: {dup}'
          print(f'ЧЕКПОИНТ-ПРОДОЛЖЕНИЕ OK: фаза-1 {len(phase1)} запросов, фаза-2 {len(phase2)}, '
                f'окон 5/5 уникальны, повторён только оборванный крахом интервал ({dup})')
          PYEOF
          n=$(psql_count "SELECT count(*) FROM orders o JOIN organizations g ON g.id=o.organization_id WHERE g.b24_member_id='ci-restart.example'")
          [ "$n" = "2" ] || fail "заказов ci-restart после рестарта ≠ 2 ($n)"
          echo "чекпоинт-продолжение подтверждено (крах посреди цикла, рестарт без пере-чтения съеденных окон)"
      - name: "интеграция — evidence dump при сбое e2e (тела, логи, БД)"
        # Диагностика сбоя 3e5d9d0: тела ответов и логи не сохранялись нигде —
        # единственный упавший шаг оставлял ноль улик. Дамп безвреден при
        # успехе (не запускается) и не трогает секреты (длины bytea, не значения).
        if: failure()
        run: |
          echo "=== тела ответов e2e (/tmp/*.json) ==="
          for f in /tmp/s0.json /tmp/s1.json /tmp/s2.json /tmp/s3.json /tmp/v0.json /tmp/v1.json \
                   /tmp/v2.json /tmp/v3.json /tmp/v4.json /tmp/v4b.json /tmp/v5.json /tmp/v6.json /tmp/v7.json \
                   /tmp/c0.json /tmp/c1.json /tmp/c2.json /tmp/c3.json /tmp/c4.json /tmp/c5.json \
                   /tmp/c6.json /tmp/c7.json /tmp/h3.json /tmp/health.json /tmp/ready.json \
                   /tmp/conn14.json /tmp/conn14r.json /tmp/p14a.json /tmp/p14e.json /tmp/p14d.json \
                   /tmp/p14d2.json /tmp/p14r.json /tmp/b14a.json /tmp/b14e.json /tmp/b14d.json \
                   /tmp/b14r.json /tmp/r14d.json /tmp/dup_publish.json /tmp/dup_resp.json; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f" 2>/dev/null || true
            echo
          done
          echo "=== /tmp/wb-stub.log (заглушка WB 1.4) ==="
          cat /tmp/wb-stub.log 2>/dev/null || true
          echo "=== /tmp/pult-workers.log (воркер 1, хвост 120) ==="
          tail -n 120 /tmp/pult-workers.log 2>/dev/null || true
          echo "=== /tmp/pult-workers-2.log (воркер до краха, хвост 80) ==="
          tail -n 80 /tmp/pult-workers-2.log 2>/dev/null || true
          echo "=== /tmp/pult-workers-3.log (воркер после рестарта, хвост 80) ==="
          tail -n 80 /tmp/pult-workers-3.log 2>/dev/null || true
          echo "=== /tmp/probe-stub.log ==="
          cat /tmp/probe-stub.log 2>/dev/null || true
          echo "=== /tmp/pult-gateway-3.log (хвост 100) ==="
          tail -n 100 /tmp/pult-gateway-3.log 2>/dev/null || true
          echo "=== marketplace_connections (секреты скрыты — только длины bytea) ==="
          docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
            psql -U pult -d pult -c "SELECT id, organization_id, marketplace, schemes, status, client_id, key_version, verified_at, created_at, updated_at, length(token_ciphertext) AS ct_len, length(token_nonce) AS nonce_len FROM marketplace_connections" || true
          echo "=== sync_runs (Story 1.4: циклы, чекпоинты, счётчики) ==="
          docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
            psql -U pult -d pult -c "SELECT r.organization_id, g.b24_member_id, r.cycle_type, r.status, r.windows_done, r.windows_total, r.orders_fetched, r.events_published, (r.checkpoint->>'completed_until') AS completed_until, r.error_hint, r.started_at, r.finished_at FROM sync_runs r JOIN organizations g ON g.id = r.organization_id ORDER BY g.b24_member_id" || true
          echo "=== orders/order_items (проекция канбана, секретов нет) ==="
          docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
            psql -U pult -d pult -c "SELECT o.id, g.b24_member_id, o.marketplace, o.external_order_id, o.scheme, o.board_column, o.status_code, o.total_price, o.is_cancelled FROM orders o JOIN organizations g ON g.id = o.organization_id ORDER BY g.b24_member_id, o.external_order_id" || true
          echo "=== organizations ==="
          docker compose -f pult/deploy/docker-compose.yml exec -T postgres \
            psql -U pult -d pult -c "SELECT id, name, b24_member_id FROM organizations ORDER BY created_at" || true
      - name: остановить шлюз, воркеры и заглушки
        if: always()
        run: |
          kill "$(cat /tmp/pult-gateway.pid)" 2>/dev/null || true
          kill "$(cat /tmp/pult-workers.pid)" 2>/dev/null || true
          kill -9 "$(cat /tmp/pult-workers.pid)" 2>/dev/null || true
          kill "$(cat /tmp/wb-stub.pid)" 2>/dev/null || true
          tail -n 40 /tmp/pult-gateway.log /tmp/pult-gateway-2.log /tmp/pult-gateway-3.log /tmp/probe-stub.log \
            /tmp/pult-workers.log /tmp/pult-workers-2.log /tmp/pult-workers-3.log /tmp/wb-stub.log 2>/dev/null || true
