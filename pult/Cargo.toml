[workspace]
resolver = "3"
members = [
    "gateway",
    "platform",
    # 7 core-доменов (hexagonal: не зависят от conveyor/* и shells/*, AD-1)
    "core/sync",
    "core/data",
    "core/finance",
    "core/shturman",
    "core/rules",
    "core/billing",
    "core/identity",
    # 4 conveyor-крейта (интеграционный/конвейерный слой)
    "conveyor/adapters",
    "conveyor/action_bus",
    "conveyor/reconciliation",
    "conveyor/workers",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# --- стек зафиксирован (AD-20): Rust 1.99.1 (rust-toolchain.toml) ---
# feature signal: graceful shutdown воркеров Story 1.4 (SIGTERM/SIGINT —
# моменты, когда обработка сигналов «появилась» по триаж-примечанию 1.1;
# шлюз остаётся без signal — HTTP-сервису допускается мгновенный stop).
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
axum = "0.8.9"
# json (jsonb-колонка marketplaces) и uuid (ключи users/organizations) —
# нужны шлюзу с Story 1.2 (шаг 0: рантайм-запросы, паттерн пробы /health).
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "json", "uuid"] }

# --- общий язык доменов ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Story 1.3 (token-vault, AD-16) — только шлюз ---
# AES-256-GCM (RustCrypto): шифротекст токенов; nonce генерируется на запись.
aes-gcm = "0.10.3"
# Пробы прав площадок: rustls (без openssl), json; дефолт-фичи отключены.
reqwest = { version = "0.12", default-features = false }

# --- Story 1.4 (синк, AD-15) ---
# Идемпотентный ключ событий = sha256(marketplace|тип|внешний id|revision);
# crates.io 29.10.2026: max_stable 0.11.1.
sha2 = "0.11.1"

# RabbitMQ-клиент воркеров (quorum-очередь, publisher confirms).
# crates.io 29.10.2026: max_stable 4.12.3. default-фичи тянут rustls — не
# нужен: AMQP внутри периметра (compose-сеть), amqps:// — отдельная задача
# эксплуатации; берём только tokio-рантайм (plain AMQP).
lapin = { version = "4.12.3", default-features = false, features = ["tokio"] }
# StreamExt над lapin::Consumer (поток доставок) — только воркеры.
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[profile.release]
lto = "thin"
