[workspace]
resolver = "3"
members = [
    "gateway",
    "platform",
    # 7 core-доменов (hexagonal: не зависят от conveyor/* и shells/*, AD-1)
    "core/sync",
    "core/data",
    "core/finance",
    "core/shturman",
    "core/rules",
    "core/billing",
    "core/identity",
    # 4 conveyor-крейта (интеграционный/конвейерный слой)
    "conveyor/adapters",
    "conveyor/action_bus",
    "conveyor/reconciliation",
    "conveyor/workers",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# --- стек зафиксирован (AD-20): Rust 1.99.1 (rust-toolchain.toml) ---
# feature signal не включён: graceful shutdown отклонён триажем Story 1.1 —
# добавляется вместе с обработкой SIGTERM, когда она появится.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
axum = "0.8.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }

# --- общий язык доменов ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
