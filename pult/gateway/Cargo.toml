[package]
name = "pult-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pult-gateway"
path = "src/main.rs"

[dependencies]
pult-platform = { path = "../platform" }
# Чистые домены правил (AD-1): шлюз — композиция портов; сторы/мапперы — здесь.
# identity: вердикт шага 0 + token-vault (Stories 1.2/1.3);
# sync: витрина прогресса/ретрая/доски (Story 1.4: объектно-совместимые порты
# чтения — Arc<dyn>, фейки в тестах хендлеров).
pult-core-identity = { path = "../core/identity" }
pult-core-sync = { path = "../core/sync" }
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Story 1.3: дата пробы stocks (dateFrom=today), AES-256-GCM, пробы прав.
chrono = { workspace = true }
aes-gcm = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
thiserror = { workspace = true }

[dev-dependencies]
# Виртуальное время: тест бюджета БД (зависший стор → 503) без реальных 2с.
tokio = { workspace = true, features = ["test-util"] }
