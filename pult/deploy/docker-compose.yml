# Dev-стек «Пульт селлера» (Story 1.1, Structural Seed).
# Инфраструктура: PostgreSQL 18 + RabbitMQ 4.4 (quorum) + Valkey 9.1 (AD-28:
# сервер кэша — только valkey/valkey, образы конкурента запрещены CI-грепом).
# Прод-механика (k8s/systemd) сюда не входит — только dev.
#
# Запуск: docker compose -f pult/deploy/docker-compose.yml up -d --wait
# Данные персистят в именованных томах — повторный up не ломает данные.

name: pult-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pult
      POSTGRES_PASSWORD: pult
      POSTGRES_DB: pult
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Только loopback: dev-стек с pult/pult-кредами не должен быть виден в LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 сменил каталог данных (breaking change образа):
      # volume монтируется в /var/lib/postgresql (в ≤17 был /var/lib/postgresql/data);
      # PGDATA внутри — /var/lib/postgresql/18/docker (проверено 28.10.2026).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pult -d pult"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.4-management
    # management-плагин — только для dev-отладки (UI на :15672)
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitdata:/var/lib/rabbitmq
    ports:
      # Только loopback (см. postgres): AMQP и management UI не наружу.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  valkey:
    image: valkey/valkey:9.1
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      # Только loopback (см. postgres): RESP без аутентификации — только localhost.
      - "127.0.0.1:6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Воркер конвейера (Story 1.4): адаптер WB → quorum-очередь → проекция PG.
  # Профиль app: infra-стек поднимается всегда, воркер — осознанно
  # (--profile app): требует мастер-ключ vault и решает, куда ходить за
  # историей (prod WB или песочница).
  # СБОРКА образа: docker compose ... --profile app build (из корня репо —
  # контекст). CI (integration) гоняет воркер хост-бинарем (паттерн шлюза
  # 1.3: rust-cache + доступ к локальной WB-заглушке) — контейнерный прогон
  # в CI не используется, образ — dev/deploy-упаковка.
  workers:
    build:
      context: ../..
      dockerfile: pult/deploy/docker/Dockerfile.worker
    image: pult-workers:dev
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://pult:pult@postgres:5432/pult
      # Креды = rabbitmq.conf (default_user bootstrap, см. deploy/rabbitmq/).
      PULT_RABBITMQ_URL: amqp://pult:pult@rabbitmq:5672/%2F
      PULT_WB_STAT_BASE: ${PULT_WB_STAT_BASE:-https://statistics-api.wildberries.ru}
      # Мастер-ключ vault (AD-16). Dev-значение — ТЕСТОВЫЙ ключ, тот же, что
      # в CI; должен совпадать с ключом шлюза, которым шифровались токены.
      # Прод-инсталляция передаёт свой через env/secrets (в репо ключа НЕТ).
      PULT_VAULT_MASTER_KEY: ${PULT_VAULT_MASTER_KEY:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f}
      PULT_SCHEDULER_INTERVAL_SECS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Воркер без HTTP-порта: процесс-зонд (PID 1 жив; смерть контейнера
      # Docker видит и без него). Содержательный liveness-детект цикла
      # (зависший прогон) — Epic 2, в спеке 1.4 deferred; декоративный зонд
      # глубже процесса не делаем — ложных «healthy» не даём.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  rabbitdata:
  valkeydata:
