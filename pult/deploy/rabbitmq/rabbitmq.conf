# RabbitMQ dev-конфиг «Пульт селлера» (Story 1.1).
# Очереди по умолчанию — quorum (RabbitMQ 4.4): надёжная доставка
# at-least-once для конвейера событий.

# Dev-креды брокера «pult/pult» (симметрия с postgres; Story 1.4 — к брокеру
# подключается конвейер). Bootstrap срабатывает ТОЛЬКО при создании базы
# с нуля (rabbitmq.com/docs/configure, проверено 31.10.2026): существующий
# том rabbitdata юзера не создаст — пересоздать том. Гостевой guest образа
# loopback-only: из хоста через проброшенный порт (docker-proxy для брокера
# не loopback) подключение guest'ом отклоняется — потому явный dev-юзер.
default_user = pult
default_pass = pult
default_user_tags.administrator = true
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

default_queue_type = quorum

# Management-плагин включён образом rabbitmq:4.4-management — только для
# dev-отладки (UI на :15672), в продакшене не используется.
